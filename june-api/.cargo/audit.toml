# `cargo audit` policy for the backend workspace.
#
# Same split as the desktop crate (`src-tauri/.cargo/audit.toml`): a
# vulnerability fails the run, an unmaintained or unsound crate is reported.
# Each ignored advisory carries its reason inline, with what would end it.

[advisories]
ignore = [
  # rsa 0.9 (Marvin attack, RUSTSEC-2023-0071, no fixed release): reached only
  # through jsonwebtoken's pure-Rust backend, whose RSA code this fork never
  # runs. The verifier it serves (the JWKS check of OS Accounts tokens) is
  # dead code here (ADR-0017 deleted OS Accounts), and the advisory concerns
  # private-key operations, which a verifier does not perform. Revisit if the
  # backend ever signs with RSA, or when jsonwebtoken's backend moves off rsa.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5.5 (RUSTSEC-2026-0387: secret-dependent branches in
  # arithmetic meant to be constant-time). The fix exists only in 0.7.6 and
  # later. 0.5 comes with elliptic-curve 0.13, through p256/p384 0.13, from
  # jsonwebtoken 11.1.0, whose newest release still asks for p256 0.13, so no
  # lockfile update reaches the fix. A timing leak needs a secret operand, and
  # none reaches this code here: jsonwebtoken only verifies ES256 signatures
  # (`crates/providers/src/jwks.rs`, dead here since ADR-0017 deleted OS
  # Accounts). A verification handles the token, the signature and the public
  # key, all public. Signing appears in tests only, with a fixture key.
  # Review on 2027-02-01, or drop this entry as soon as jsonwebtoken moves to
  # p256 0.14.
  "RUSTSEC-2026-0387",
]
