[server]
host = "0.0.0.0"
port = 8080
request_timeout_secs = 600
max_audio_bytes = 26214400
max_json_bytes = 524288

# Public facts shown on the /verify page. source_commit is not set here — the
# build stamps it via JUNE__ATTESTATION__SOURCE_COMMIT.
[attestation]
source_repo_url = "https://github.com/Irdanwen/sub-rosa"
# Empty: this backend is not a published container, it runs on loopback inside
# the app. The /verify page omits the image row when this is blank.
image_repo = ""
# The TEE attestation belongs to Carpe Diem, the operator that runs the models.
trust_center_url = "https://carpe-diem.xyz"

[issue_reports]
# Upstream files user-submitted reports as issues on its own tracker. This
# fork has no such sink, so every field is blank: OsPlatformIssueReportSink
# only builds with a key, and without one reports land in structured logs.
# Left in place (rather than deleted) so upstream re-merges still apply here.
os_platform_api_url = ""
os_platform_api_key = ""
os_platform_org = ""
os_platform_project = ""
os_platform_label = ""
os_platform_reward_asset = ""

[os_accounts]
# api_url has no default — must come from JUNE__OS_ACCOUNTS__API_URL
# per environment so a missing override fails loud against the dev
# fallback in AppConfig::default rather than silently hitting staging.
# iss/aud are only read by JwksTokenVerifier, which this fork never builds:
# the sidecar always runs with local_dev.enabled, so LocalDevTokenVerifier
# checks the bearer the app generated. Blank so no third-party issuer ships
# inside the binary (config.toml is baked in via include_str! on iOS).
iss = ""
# aud is the canonical audience for tokens minted by OS Accounts for ANY
# consumer app, not a per-app value. Strict-string match.
aud = "open-software-apps"
jwks_refresh_secs = 300
jwks_miss_min_backoff_secs = 5
authorize_hold_ttl_note_transcribe_secs = 60
authorize_hold_ttl_note_generate_secs = 300
authorize_hold_ttl_dictate_transcribe_secs = 30
authorize_hold_ttl_dictate_cleanup_secs = 30
note_transcribe_preview_max_audio_secs = 30
flat_estimate_credits = 250
# Flat per-request credits for the Venice web tools. Venice bills ~$0.01
# (about 10 credits) per /augment/search and /augment/scrape call.
web_search_credits = 20
web_fetch_credits = 20
authorize_hold_ttl_web_secs = 30

[upstreams.openai]
base_url = "https://api.openai.com/v1"

[upstreams.venice]
base_url = "https://api.venice.ai/api/v1"

[pricing."gpt-4o-mini-transcribe"]
unit = "seconds"
credits_per_million_seconds = 1000000
provider = "openai"
model_type = "asr"
display_name = "GPT-4o mini transcribe"
description = "Fast OpenAI speech-to-text model."
privacy = "anonymized"
context_tokens = 16000
traits = ["prompt"]
capabilities = []

[pricing."gpt-4o-transcribe"]
unit = "seconds"
credits_per_million_seconds = 2000000
provider = "openai"
model_type = "asr"
display_name = "GPT-4o transcribe"
description = "Large OpenAI speech-to-text model."
privacy = "anonymized"
context_tokens = 16000
traits = ["prompt"]
capabilities = []

[pricing."nvidia/parakeet-tdt-0.6b-v3"]
unit = "seconds"
credits_per_million_seconds = 100000
provider = "venice"
model_type = "asr"
display_name = "Parakeet TDT 0.6B v3"
privacy = "private"

# Fallback pricing for the default and suggested text models; the live Venice
# catalog overrides this on boot. Keep the GLM 5.2 entry in sync with
# DEFAULT_GENERATION_MODEL in the Tauri providers module.
[pricing."zai-org-glm-5-2"]
unit = "tokens"
input_credits_per_million_tokens = 1750
output_credits_per_million_tokens = 5500
provider = "venice"
model_type = "text"
display_name = "GLM 5.2"
privacy = "private"
context_tokens = 200000
capabilities = [
  "supportsFunctionCalling",
  "supportsReasoning",
  "supportsReasoningEffort",
  "supportsResponseSchema",
  "supportsWebSearch",
]

[pricing."kimi-k2-6"]
unit = "tokens"
input_credits_per_million_tokens = 850
output_credits_per_million_tokens = 4660
provider = "venice"
model_type = "text"
display_name = "Kimi K2.6"
privacy = "private"
context_tokens = 256000
# Kimi K2.6 is natively multimodal (Venice supportsVision); it is the
# image-input fallback the app switches to. Keep in sync with the kimi-k2-6
# entry in default_pricing() (crates/config/src/lib.rs) so the fallback still
# resolves to a vision model when the live Venice catalog is unreachable and
# this packaged config is what /models serves.
capabilities = [
  "supportsFunctionCalling",
  "supportsVision",
  "supportsMultipleImages",
]

[pricing."zai-org-glm-5-1"]
unit = "tokens"
input_credits_per_million_tokens = 1750
output_credits_per_million_tokens = 5500
provider = "venice"
model_type = "text"
display_name = "GLM 5.1"
privacy = "private"
context_tokens = 200000
capabilities = [
  "supportsFunctionCalling",
  "supportsReasoning",
  "supportsReasoningEffort",
  "supportsResponseSchema",
  "supportsWebSearch",
]

[pricing."zai-org-glm-5"]
unit = "tokens"
input_credits_per_million_tokens = 1000
output_credits_per_million_tokens = 3200
provider = "venice"
model_type = "text"
display_name = "GLM 5"
privacy = "private"
context_tokens = 198000
capabilities = ["supportsFunctionCalling"]

[pricing."nvidia-nemotron-3-nano-30b-a3b"]
unit = "tokens"
input_credits_per_million_tokens = 70
output_credits_per_million_tokens = 300
provider = "venice"
model_type = "text"
display_name = "Nemotron Nano 30B (dictation cleanup)"
privacy = "private"
