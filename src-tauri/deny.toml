# What may enter the dependency tree, beyond "does it have a CVE".
#
# `cargo audit` answers whether a dependency is known-vulnerable.
# `cargo deny` answers the questions that have no advisory: what licence did we
# just agree to, where did this crate come from, and how many copies of the same
# library are we shipping. The app bundles an agent runtime, so its tree earns
# the same scrutiny as its own code.
#
# Run: `cargo deny --manifest-path src-tauri/Cargo.toml --all-features check`

[graph]
all-features = true

[advisories]
# `cargo audit` owns vulnerabilities, with its policy in `.cargo/audit.toml`.
# Here the same split applies: a vulnerability fails the run, and a crate that
# is merely unmaintained, unsound, or yanked is reported. Conflating the two
# trains everyone to ignore the job, and the GTK3 set below is the proof — ten
# unmaintained bindings for a platform this app does not ship.
yanked = "warn"
# Only crates this repo depends on directly. An unmaintained binding buried in
# Tauri's GTK3 stack is upstream's to replace and ours to know about, not a
# reason to fail every pull request.
unmaintained = "workspace"
# rsa via jsonwebtoken's pure-Rust backend; see .cargo/audit.toml for why.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
# Every licence below is one actually present in the tree today. The list is an
# allowlist on purpose: a new licence should be a decision, not a diff nobody
# read.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft. Symphonia (the in-process audio decoder, ADR-0026) and
  # the CSS parser are used unmodified, which MPL allows in a closed binary.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# UEFI bindings reached through `getrandom`, for a target this app never builds.
# Allowed for this crate only, so LGPL cannot arrive anywhere else unnoticed.
name = "r-efi"
allow = ["LGPL-2.1-or-later"]

[bans]
# Duplicate major versions are the norm in a Tauri tree (three `windows-sys`
# generations, two `syn`). Flagging them is useful; failing on them would mean
# ignoring the whole job.
multiple-versions = "warn"
# A `*` on a published crate is a supply-chain hole. A `path =` dependency
# inside this repo is not one: `june-embed` and the `june-*` crates are built
# from the tree, not resolved from a registry.
wildcards = "deny"
allow-wildcard-paths = true
[[bans.deny]]
# TLS goes through rustls everywhere (see both Cargo.toml files). An openssl
# arriving transitively would mean shipping a second TLS stack, and a system
# dependency the release pipeline does not build.
name = "openssl-sys"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
