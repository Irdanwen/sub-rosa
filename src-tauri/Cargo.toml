[package]
name = "os-june"
version = "1.6.0"
description = "Sub Rosa"
authors = ["Open Software Network"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"

[lib]
name = "os_june_lib"
# staticlib/cdylib are required by the iOS (Tauri mobile) build; rlib keeps
# the desktop binary and unit tests linking against the same crate.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "os-june"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
dotenvy = "0.15"
hound = "3.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "cookies"] }
# Matches the version tauri-plugin-updater resolves, so the version_comparator
# closure can name the same `semver::Version` the updater hands it.
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# Avoid the SQLx umbrella crate here. Its optional macro/database dependencies
# put unused MySQL/Postgres packages into Cargo.lock and cargo-audit.
# sqlx-sqlite does not expose a public runtime-tokio feature in SQLx 0.8.x, so
# the direct sqlx-core dependency intentionally enables its runtime hook.
sqlx = { package = "sqlx-core", version = "0.8", default-features = false, features = ["_rt-tokio", "chrono", "uuid"] }
sqlx-sqlite = { version = "0.8", default-features = false, features = ["bundled", "chrono", "uuid"] }
tauri = { version = "2.8.0", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
thiserror = "2.0"
tokio = { version = "1.42", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
urlencoding = "2"
uuid = { version = "1.11", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-haptics = "2.3.2"

# Desktop-only plugins: updater/single-instance have no mobile support, and
# the process plugin (relaunch) is desktop-shaped. The iOS build must not pull
# them in.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
# Videomaker film production (ADR-0010, desktop-only surface): the Studio
# wallet signs SIWE messages (EIP-191 keccak digest over secp256k1). Kept off
# the mobile build — the Films surface is macOS + Windows.
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"

# The apple-native keyring backend (security-framework) covers both macOS and
# iOS keychains.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Mobile cannot spawn the june-api sidecar binary (no subprocesses on iOS);
# the same server runs in-process instead. Desktop keeps the external binary,
# so this dependency compiles only for mobile targets. objc2 drives the
# AVAudioSession plumbing required before cpal can record on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
june-embed = { path = "../june-api/crates/embed" }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSError",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSURL",
    "NSValue",
    "NSData",
    "NSGeometry",
    "objc2-core-foundation",
] }
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.14"
