[package]
name = "os-june"
version = "1.49.2"
description = "Sub Rosa"
authors = ["Open Software Network"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"

[lib]
name = "os_june_lib"
# staticlib/cdylib are required by the iOS (Tauri mobile) build; rlib keeps
# the desktop binary and unit tests linking against the same crate.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "os-june"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
dotenvy = "0.15"
hound = "3.5"
# Re-encodes an attached image down to what the request can carry (see
# `hermes_image_fit`). Decoders for the formats the bridge accepts, plus the
# JPEG encoder it re-encodes to; no default features, so nothing else is pulled
# in for a dependency tauri already resolves.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
rand = "0.8"
# Parses podcast feeds so an enclosure can be fetched (ADR-0028). Already in
# the tree transitively, so pinning it here adds no new crate to the lockfile.
quick-xml = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "cookies"] }
# Pure-Rust FFT for the echo-rejection similarity gate (GCC-PHAT lag estimation).
rustfft = "6.2"
# Matches the version tauri-plugin-updater resolves, so the version_comparator
# closure can name the same `semver::Version` the updater hands it.
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Avoid the SQLx umbrella crate here. Its optional macro/database dependencies
# put unused MySQL/Postgres packages into Cargo.lock and cargo-audit.
# sqlx-sqlite does not expose a public runtime-tokio feature in SQLx 0.8.x, so
# the direct sqlx-core dependency intentionally enables its runtime hook.
# Decodes imported audio and video containers in-process (ADR-0026): pure
# Rust, no subprocess, no bundled ffmpeg to sign or notarize, and it builds for
# iOS like everything else. Pinned to 0.5 rather than the ten-day-old 0.6:
# 0.5.5 is the documented, widely-deployed API and needs no MSRV bump.
# Defaults already cover FLAC/Vorbis/PCM/ADPCM in OGG, MKV/WebM and WAV; the
# rest are the containers and codecs an import actually arrives in.
symphonia = { version = "0.5.5", features = ["aac", "aiff", "alac", "caf", "isomp4", "mp3"] }
sqlx = { package = "sqlx-core", version = "0.8", default-features = false, features = ["_rt-tokio", "chrono", "uuid"] }
sqlx-sqlite = { version = "0.8", default-features = false, features = ["bundled", "chrono", "uuid"] }
tauri = { version = "2.8.0", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
thiserror = "2.0"
tokio = { version = "1.42", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
urlencoding = "2"
uuid = { version = "1.11", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-haptics = "2.3.2"

# Desktop-only plugins: updater/single-instance have no mobile support, the
# process plugin (relaunch) is desktop-shaped, and autostart (launch at login)
# is a desktop concept. The iOS build must not pull them in.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Spawning the user's own yt-dlp (ADR-0028, desktop rail). Declared per-target
# rather than in the shared dependency so the iOS build carries no
# process-spawning machinery it can never use.
tokio = { version = "1.42", features = ["process"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-autostart = "2.5.1"
# The apple-native keyring backend (security-framework) covers both macOS and
# iOS keychains.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Calendar context (crate::calendar). EventKit is the same framework on both
# platforms, so one module serves the desktop and the phone; typed bindings
# beat hand-rolled msg_send! for an API this shaped (dates, predicates,
# participants). Minimal features: the defaults drag in AppKit, MapKit and
# CoreLocation for surfaces we never touch.
block2 = "0.6"
objc2 = "0.6"
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKReminder",
    "EKTypes",
] }
# Spotlight (crate::spotlight): notes findable from the system's own search,
# reachable from objc2 exactly like the other native bridges — no Swift, no
# extension target. Only what the index needs.
objc2-core-spotlight = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "CSSearchableIndex",
    "CSSearchableItem",
    "CSSearchableItemAttributeSet",
    "CSSearchableItemAttributeSet_General",
    "CSSearchableItemAttributeSet_Documents",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSString",
    "NSError",
    "NSURL",
] }

# Mobile cannot spawn the june-api sidecar binary (no subprocesses on iOS);
# the same server runs in-process instead. Desktop keeps the external binary,
# so this dependency compiles only for mobile targets. objc2 drives the
# AVAudioSession plumbing required before cpal can record on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
june-embed = { path = "../june-api/crates/embed" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSURL",
    "NSValue",
    "NSData",
    "NSGeometry",
    "objc2-core-foundation",
] }
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3.14"
