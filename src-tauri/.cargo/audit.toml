# `cargo audit` policy for the desktop crate.
#
# Read with `cargo audit --file src-tauri/Cargo.lock` from the repo root, and
# in CI by `.github/workflows/supply-chain.yml`.
#
# The default policy fails the run on a vulnerability and reports unmaintained,
# unsound and yanked crates as warnings. That split is deliberate: a
# vulnerability is an incident, an unmaintained crate is a planning problem, and
# conflating them trains everyone to ignore the job.

[advisories]
ignore = [
  # rsa 0.9 (Marvin attack, RUSTSEC-2023-0071, no fixed release): reached only
  # through jsonwebtoken's pure-Rust backend, whose RSA code this fork never
  # runs. The verifier it serves (the JWKS check of OS Accounts tokens) is
  # dead code here (ADR-0017 deleted OS Accounts), and the advisory concerns
  # private-key operations, which a verifier does not perform. Revisit if the
  # backend ever signs with RSA, or when jsonwebtoken's backend moves off rsa.
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5.5 (RUSTSEC-2026-0387: secret-dependent branches in
  # arithmetic meant to be constant-time). The fix exists only in 0.7.6 and
  # later. 0.5 comes with elliptic-curve 0.13, through p256/p384 0.13, from
  # age 0.12.1 (and its hpke 0.12) and jsonwebtoken 11.1.0 (via june-embed).
  # The newest releases of both still ask for p256 0.13, so no lockfile update
  # reaches the fix. A timing leak needs a secret operand, and none reaches
  # this code here:
  # - the archive (`archive.rs`) uses age's scrypt recipient and identity
  #   only. P-256 serves age's `tag`/`tagpq` recipients, which this app never
  #   builds, and age has no identity for them, so decrypting an imported
  #   archive never runs P-256 arithmetic, whatever stanzas it carries;
  # - jsonwebtoken only verifies ES256 signatures (`june-providers/src/
  #   jwks.rs`, dead here since ADR-0017 deleted OS Accounts). A verification
  #   handles the token, the signature and the public key, all public. Signing
  #   appears in tests only, with a fixture key.
  # Our own P-256 (p256 0.14, with crypto-bigint 0.7.10) is on the fixed line.
  # Review on 2027-02-01, or drop this entry as soon as age and jsonwebtoken
  # move to p256 0.14.
  "RUSTSEC-2026-0387",
]
