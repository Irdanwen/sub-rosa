# `cargo audit` policy for the desktop crate.
#
# Read with `cargo audit --file src-tauri/Cargo.lock` from the repo root, and
# in CI by `.github/workflows/supply-chain.yml`.
#
# The default policy fails the run on a vulnerability and reports unmaintained,
# unsound and yanked crates as warnings. That split is deliberate: a
# vulnerability is an incident, an unmaintained crate is a planning problem, and
# conflating them trains everyone to ignore the job.

[advisories]
ignore = [
  # quick-xml < 0.41: unbounded namespace allocation and quadratic attribute
  # checking on hostile XML. THIS APP'S OWN USE IS FIXED — `ingest/feed.rs`
  # parses remote RSS with 0.41. The two versions still in the tree are
  # Tauri's, and neither sees input from the network:
  #   0.39.4 <- plist <- tauri (reads this app's own Info.plist at build time)
  #   0.37.5 <- tauri-winrt-notification <- notify-rust (toast XML we build)
  # Drop these two lines when Tauri ships a build on quick-xml >= 0.41, and
  # re-check that `src-tauri/Cargo.toml` still asks for 0.41 or later.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]
