name: os-june
options:
  bundleIdPrefix: xyz.carpediem.subrosa
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Sub Rosa
      PRODUCT_BUNDLE_IDENTIFIER: xyz.carpediem.subrosa
      DEVELOPMENT_TEAM: H6N5V777LL
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  os-june_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Rust static libraries are linked below, never copied into the app.
      # Including this directory as sources makes XcodeGen copy both debug
      # and release libapp.a to the same resource path after a local build.
      # Also carries <lang>.lproj/InfoPlist.strings: the usage descriptions
      # below in every language of src/locales, which XcodeGen picks up as a
      # variant group. The Mac app ships the same files (tauri.macos.conf.json).
      - path: os-june_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: os-june_iOS/Info.plist
      # XcodeGen *generates* Info.plist from these properties, so a key that is
      # only in the committed plist is silently dropped the next time the
      # project is regenerated (`tauri ios init` / `xcodegen`). For the privacy
      # usage descriptions that is not cosmetic: iOS terminates the app the
      # moment it touches a protected resource without one, so a lost key is a
      # crash, not a denied permission.
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        # The vault uses Rust AES-GCM beyond OS TLS. Complete export compliance
        # in App Store Connect; do not carry forward the former TLS-only waiver.
        # Recording a note or a dictation.
        NSMicrophoneUsageDescription:
          Sub Rosa records microphone audio locally so it can transcribe and generate your notes, and hears you during a voice conversation.
        # The system-audio source of a note (microphone plus system audio).
        NSCalendarsUsageDescription: Sub Rosa reads your calendar on this device so a recording can know which meeting it belongs to. Nothing is sent anywhere.
        NSCalendarsFullAccessUsageDescription: Sub Rosa reads your calendar on this device so a recording can know which meeting it belongs to. Nothing is sent anywhere.
        NSRemindersUsageDescription: Sub Rosa adds a reminder to your list when you tap to accept one it suggested. It never reads or changes anything else.
        NSRemindersFullAccessUsageDescription: Sub Rosa adds a reminder to your list when you tap to accept one it suggested. It never reads or changes anything else.
        NSAudioCaptureUsageDescription:
          Sub Rosa records system audio locally when you choose microphone plus system audio for a note.
        # Taking a photo to attach to a chat, and the Studio reference picker's
        # camera button (capture="environment").
        NSCameraUsageDescription:
          Sub Rosa opens the camera when you take a photo to attach to a chat or to a Studio generation, when you scan a document into a note, and when you show something during a voice conversation.
        # Saving a Studio generation to the photo library. Write only: the
        # picker reads through PHPicker, which needs no permission.
        NSPhotoLibraryAddUsageDescription:
          Sub Rosa saves images and videos you generate in Studio to your photo library.
        CFBundleURLTypes:
          - CFBundleURLName: subrosa
            CFBundleURLSchemes: [subrosa]
        # Every language of the app's own catalog (src/locales): the
        # Shortcuts actions (Sources/os-june/Intents) read their titles from
        # the matching .lproj.
        CFBundleLocalizations: [en, fr, de, it, es, pt-BR]
        # Background execution (see src-tauri/src/ios_background.rs):
        # `audio` keeps a note recording alive with the screen locked,
        # `processing`/`fetch` let BGTaskScheduler wake the app up later to
        # finish queued generations, transcriptions and chat turns. The
        # permitted identifiers must match the ones registered in Rust.
        UIBackgroundModes: [audio, processing, fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - xyz.carpediem.subrosa.refresh
          - xyz.carpediem.subrosa.processing
          # iOS 26 continued processing for a note transcription
          # (crate::ios_continued). The wildcard is the documented form.
          - xyz.carpediem.subrosa.transcribe.*
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Placeholders. `tauri ios build` stamps the real version into the
        # generated Info.plist from tauri.conf.json, so these are never what
        # ships - but they must not contradict the plist either, or a reader
        # (and a regeneration) inherits a version from another era. A test
        # pins the two files to each other; keep them equal.
        CFBundleShortVersionString: 1.88.1
        CFBundleVersion: "1.88.1"
    entitlements:
      path: os-june_iOS/os-june_iOS.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:subrosa.furetier.com
        com.apple.security.application-groups:
          - group.xyz.carpediem.subrosa
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # The Shortcuts actions are Swift in the app target itself (not an
        # extension: an App Intent that opens the app runs in its process).
        SWIFT_VERSION: 5.0
        # The share extension is also named "Sub Rosa", so both would emit a
        # Sub_Rosa.swiftmodule into the same products folder and the build
        # fails ("Multiple commands produce"). The extension's name is in its
        # Info.plist ($(PRODUCT_MODULE_NAME).ShareViewController); the app's
        # is not referenced anywhere, so the app is the one renamed.
        PRODUCT_MODULE_NAME: SubRosaApp
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      # BGTaskScheduler is looked up dynamically from Rust, which only finds
      # the class if the framework is actually linked into the process.
      - sdk: BackgroundTasks.framework
      # The native passkey bridge uses AuthenticationServices symbols from
      # Rust's static library, which Xcode must link into the app target.
      - sdk: AuthenticationServices.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      # The document scanner (crate::scan): VisionKit's camera and Vision's
      # text recognition, from the Objective-C file in Rust's static library.
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: WebKit.framework
      # The Shortcuts actions (iOS 16+). Weak, because the app still runs on
      # iOS 15, where a strong link to a framework that does not exist stops
      # the app at launch.
      - sdk: AppIntents.framework
        weak: true
      # The share sheet's half of "share to Sub Rosa" (ADR-0048): embedded
      # in the app bundle, signed with its own profile, sharing the app group.
      - target: os-june_Share
        embed: true
        codeSign: true
      # The Home Screen and Lock Screen widgets (ADR-0095): links into the
      # app's addresses, in the same app group.
      - target: os-june_Widgets
        embed: true
        codeSign: true
      # The Apple Watch app (ADR-0095), in the iOS app's Watch folder the way
      # Xcode embeds a single-target watch app. The phone's end of its channel
      # is Sources/os-june/Watch/WatchBridge.swift.
      - target: os-june_Watch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
      - sdk: WatchConnectivity.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  os-june_Share:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Sub Rosa
        CFBundleShortVersionString: 1.88.1
        CFBundleVersion: "1.88.1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsAudioWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.carpediem.subrosa
    settings:
      base:
        PRODUCT_NAME: Sub Rosa
        PRODUCT_BUNDLE_IDENTIFIER: xyz.carpediem.subrosa.share
        DEVELOPMENT_TEAM: H6N5V777LL
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1,2
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: false
  # The Home Screen and Lock Screen widgets (ADR-0095). Buttons, not views of
  # data: each one opens a `subrosa://` address. In the app group with the
  # app, the share extension and the Shortcuts actions.
  os-june_Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Sub Rosa
        CFBundleShortVersionString: 1.88.1
        CFBundleVersion: "1.88.1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.carpediem.subrosa
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: SubRosaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: xyz.carpediem.subrosa.widgets
        DEVELOPMENT_TEAM: H6N5V777LL
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1,2
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: false
  # The Apple Watch app (ADR-0095): dictate a question, the iPhone answers.
  # A single-target watch app (watchOS 10), embedded in the iOS app; its
  # bundle id extends the app's, as watchOS requires of a companion.
  os-june_Watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Sub Rosa
        CFBundleShortVersionString: 1.88.1
        CFBundleVersion: "1.88.1"
        CFBundleLocalizations: [en, fr, de, it, es, pt-BR]
        WKApplication: true
        WKCompanionAppBundleIdentifier: xyz.carpediem.subrosa
        WKRunsIndependentlyOfCompanionApp: false
    dependencies:
      - target: os-june_WatchWidgets
        embed: true
        codeSign: true
      - sdk: WatchConnectivity.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: SubRosaWatch
        PRODUCT_BUNDLE_IDENTIFIER: xyz.carpediem.subrosa.watchkitapp
        DEVELOPMENT_TEAM: H6N5V777LL
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Inside the iOS app, never a product of the archive on its own.
        SKIP_INSTALL: true
  # The watch face complication (ADR-0095): "Ask", opening the watch app.
  os-june_WatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sub Rosa
        CFBundleShortVersionString: 1.88.1
        CFBundleVersion: "1.88.1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: SubRosaWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: xyz.carpediem.subrosa.watchkitapp.widgets
        DEVELOPMENT_TEAM: H6N5V777LL
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 4
        SKIP_INSTALL: true
