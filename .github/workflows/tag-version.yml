name: tag-version

# Creates a semver release tag server-side, for sessions that can push
# branches but not tags (remote-agent git relays restrict refs/tags, and
# their Actions API access can be read-only, which rules out
# workflow_dispatch too). Pushing a branch named release-tag/vX.Y.Z runs
# this workflow: it tags that commit and deletes the trigger branch.
#
# The tag is pushed with RELEASES_REPO_TOKEN when that token can push here,
# because a ref pushed with the run's own GITHUB_TOKEN never triggers other
# workflows — and the whole point is for the tag to fire release.yml. When
# that token cannot push to this repo, fall back to GITHUB_TOKEN for the tag
# and dispatch release.yml explicitly instead.
#
# Anyone with branch-push rights can mint a release tag through this — the
# same trust level as pushing to main in this single-maintainer repo.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to create, e.g. v1.4.2"
        required: true
  push:
    branches: ["release-tag/**"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials MUST be false: checkout otherwise leaves a
      # http.<github>.extraheader with GITHUB_TOKEN in the local git config,
      # and that header overrides any PAT embedded in a push URL — the tag
      # then authenticates as GITHUB_TOKEN and never triggers release.yml
      # (exactly the silent failure this workflow exists to avoid).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-${REF_NAME#release-tag/}}"
          # Same strict gate as release.yml's resolve job: this value flows
          # into ref names, so reject anything that is not semver-ish.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Refusing non-semver tag: $tag" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create tag and ensure a release run
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            # Tag already exists (e.g. a previous run created it with an auth
            # that did not trigger workflows). Creating it again is impossible,
            # so start the release explicitly instead. Dispatch and tag-push
            # are mutually exclusive paths, so this cannot double-build.
            echo "Tag $TAG already exists; dispatching release.yml for it."
            gh workflow run release.yml -f "tag=$TAG"
          else
            git tag "$TAG" "$GITHUB_SHA"
            if [ -n "$RELEASES_REPO_TOKEN" ] &&
               git push "https://x-access-token:${RELEASES_REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"; then
              echo "Tag pushed with RELEASES_REPO_TOKEN; release.yml triggers from the tag."
            else
              echo "RELEASES_REPO_TOKEN cannot push here; tagging with GITHUB_TOKEN and dispatching release.yml."
              git push "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
              gh workflow run release.yml -f "tag=$TAG"
            fi
          fi
      - name: Delete trigger branch
        if: github.event_name == 'push'
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: git push "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" --delete "$GH_REF_NAME" || true
