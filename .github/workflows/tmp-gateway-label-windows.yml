# TEMPORARY (removed before merge): proves the gateway service-label fix on a
# real Windows: both PowerShell copies of the patch under Windows PowerShell
# 5.1, the task name the patched Hermes derives, and the migration against the
# real Task Scheduler.
name: tmp gateway label on Windows
on:
  push:
    branches: [fix/hermes-service-label-per-home]
permissions:
  contents: read
jobs:
  hermes-patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned Hermes
        shell: bash
        run: |
          commit=$(sed -n 's/^const HERMES_AGENT_INSTALL_COMMIT: &str = "\(.*\)";/\1/p' src-tauri/src/hermes_bridge.rs)
          sha=$(grep -A1 'HERMES_SOURCE_TARBALL_SHA256' src-tauri/src/hermes_bridge.rs | sed -n 's/.*"\([0-9a-f]\{64\}\)".*/\1/p' | head -1)
          curl -LsSf "https://github.com/NousResearch/hermes-agent/archive/$commit.tar.gz" -o hermes.tar.gz
          echo "$sha  hermes.tar.gz" | sha256sum -c -
          mkdir -p work && tar -xzf hermes.tar.gz -C work
          for d in pristine bundle managed; do mkdir -p $d; cp -r work/hermes-agent-*/. $d/; done
      - name: Extract both PowerShell copies of the patch
        shell: bash
        run: |
          python - <<'PY'
          def grab(path, start, end):
              s = open(path, encoding="utf-8").read(); i = s.index(start); return s[i:s.index(end, i)]
          open("t-bundle.ps1", "w", encoding="utf-8").write(
              '$ErrorActionPreference="Stop"\nfunction Fail([string]$m){ throw $m }\nfunction Log([string]$m){ Write-Host $m }\n$agentDir=$args[0]\n'
              + grab("scripts/bundle-hermes-runtime-windows.ps1", "# Give this Hermes home", "# Hermes 0.19 web imports"))
          open("t-managed.ps1", "w", encoding="utf-8").write(
              '$ErrorActionPreference="Stop"\n$installDir=$args[0]\n'
              + grab("src-tauri/src/hermes_bridge/managed_install.ps1", "# Give this Hermes home", "# Bootstrap a self-contained uv"))
          PY
      - name: Patch under Windows PowerShell 5.1, twice
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          foreach ($i in 1, 2) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File t-bundle.ps1 (Resolve-Path bundle)
            if ($LASTEXITCODE -ne 0) { throw "bundle patch failed" }
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File t-managed.ps1 (Resolve-Path managed)
            if ($LASTEXITCODE -ne 0) { throw "managed patch failed" }
          }
      - name: Same file, marker once, nothing else changed
        shell: bash
        run: |
          cmp bundle/hermes_cli/gateway.py managed/hermes_cli/gateway.py
          test "$(grep -c patch-hermes-service-label bundle/hermes_cli/gateway.py)" = 1
          diff pristine/hermes_cli/gateway.py bundle/hermes_cli/gateway.py | tee patch.diff || true
          test "$(grep -c '^[<>]' patch.diff)" = 4
          python -c "import io;s=open('bundle/hermes_cli/gateway.py','rb').read();s.decode('utf-8');print('utf-8 ok', len(s))"
      - name: Task names the patched Hermes derives
        shell: pwsh
        run: |
          python -m pip install -q pyyaml requests
          $code = "from hermes_cli.gateway_windows import get_task_name; print(get_task_name())"
          $sub = Join-Path $env:APPDATA "xyz.carpediem.subrosa\hermes"
          $dev = Join-Path $env:APPDATA "xyz.carpediem.subrosa-dev\hermes"
          $own = Join-Path $env:LOCALAPPDATA "hermes"
          $rows = foreach ($tree in "pristine", "bundle") {
            foreach ($home_ in $sub, $dev, $own) {
              $env:HERMES_HOME = $home_; $env:PYTHONPATH = (Resolve-Path $tree)
              $name = (python -c $code).Trim()
              "$tree`t$home_`t$name"
            }
          }
          $rows
          $bundle = $rows | Where-Object { $_ -like "bundle*" } | ForEach-Object { ($_ -split "`t")[2] }
          if ($bundle[0] -notmatch '^Hermes_Gateway_[0-9a-f]{8}$') { throw "release home: $($bundle[0])" }
          if ($bundle[1] -notmatch '^Hermes_Gateway_[0-9a-f]{8}$' -or $bundle[1] -eq $bundle[0]) { throw "dev home: $($bundle[1])" }
          if ($bundle[2] -ne 'Hermes_Gateway') { throw "platform home: $($bundle[2])" }
          $pristine = $rows | Where-Object { $_ -like "pristine*" } | ForEach-Object { ($_ -split "`t")[2] }
          if ($pristine[0] -ne 'Hermes_Gateway') { throw "expected the bug on the pristine tree" }

  migration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tauri-cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-registry-${{ runner.os }}-
      - name: Stage placeholder june-api sidecar (externalBin)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/june-api-$(rustc -vV | sed -n 's/host: //p').exe"
      - name: Gateway label tests, the real Task Scheduler included
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib hermes_bridge::gateway_ -- --include-ignored
