name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "hud.html"
      - "index.html"
      - "meeting-hud.html"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig.json"
      - "vite.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - "hud.html"
      - "index.html"
      - "meeting-hud.html"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "tsconfig.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

  # Biome enforces JS/TS/JSON/CSS formatting + linting for src/ and scripts/.
  # `pnpm check` fails on formatting drift, lint errors, and banned imports
  # (the icons-central-only spec bans lucide via noRestrictedImports).
  biome:
    name: Biome check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      # Twenty-one rules are still "warn" (biome.json); per rule the count
      # may only go down. biome-warnings.json holds the numbers.
      - name: Biome warnings ratchet
        run: pnpm check:ratchet
      - name: French catalog in step with the code
        run: pnpm i18n:check

  # Decides whether the macOS Rust job has anything to test. macOS minutes
  # bill at 10x Linux, and most changes here are frontend-only — `cargo test`
  # reads nothing outside src-tauri/, so a pure frontend diff doesn't need a
  # macOS runner. The Windows bundle job has a broader packaged-app diff scope
  # because it verifies the built frontend, Tauri config, and installer shape
  # on a native Windows host. Unknown diff bases (force pushes, branch creation) fail
  # open to "changed" so the suite can never be skipped by accident.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      rust: ${{ steps.diff.outputs.rust }}
      desktop_bundle: ${{ steps.diff.outputs.desktop_bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Diff changed paths
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "desktop_bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE" HEAD)"
          # Frontend checks (biome, typecheck, vitest) read src/ and scripts/, never
          # src-tauri/, so a src-tauri-only diff skips them and vice versa.
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/desktop\.yml$|biome\.json$|hud\.html$|index\.html$|meeting-hud\.html$|package\.json$|pnpm-lock\.yaml$|public/|scripts/|src/|tsconfig\.json$|vite\.config\.ts$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(src-tauri/|\.github/workflows/desktop\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/desktop\.yml$|hud\.html$|index\.html$|meeting-hud\.html$|package\.json$|pnpm-lock\.yaml$|public/|scripts/|src/|src-tauri/|tsconfig\.json$|vite\.config\.ts$)'; then
            echo "desktop_bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop_bundle=false" >> "$GITHUB_OUTPUT"
          fi

  # rustfmt needs no compilation and none of the macOS-only system deps, so it
  # runs on cheap Linux for fast feedback. Clippy and tests stay on macOS (see
  # the `rust` job) because src-tauri gates real code behind
  # `#[cfg(target_os = "macos")]` that a Linux lint pass would silently skip.
  rust-fmt:
    name: Tauri Rust format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      # `-p os-june`, not `--all`: src-tauri is a standalone package, but it
      # depends on june-api by path (june-embed, for the iOS in-process
      # sidecar), so `--all` walked into june-api and formatted crates this
      # workflow does not even watch — it triggers on src/** and src-tauri/**
      # only. A violation introduced under june-api therefore turned this job
      # red on later, unrelated desktop commits, which is how one stayed red
      # for three days looking like pre-existing breakage. june-api.yml runs
      # its own `cargo fmt --all` from june-api/ and is the authority there.
      - name: Cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -p os-june -- --check

  rust:
    name: Tauri Rust clippy and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tauri-cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-registry-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: tauri-cargo-target-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-target-${{ runner.os }}-

      # tauri-build validates every externalBin path at compile time, and the
      # june-api sidecar is only built for real bundles (release.yml). An empty
      # placeholder satisfies the existence check — nothing in clippy or the
      # tests executes the sidecar binary.
      - name: Stage placeholder june-api sidecar (externalBin)
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/june-api-$(rustc -vV | sed -n 's/host: //p')"

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-rust:
    name: Tauri Windows build
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.desktop_bundle == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tauri-cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-registry-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: tauri-cargo-target-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-target-${{ runner.os }}-

      # The embedded managed-install script only ever runs on end-user
      # machines that lack the bundled runtime, so CI never executes it —
      # parse it (and every repo .ps1) so a syntax error can't ship.
      - name: Parse PowerShell surfaces
        shell: pwsh
        run: |
          function Assert-Parses([string]$Label, [string]$Source) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($Source, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse errors in ${Label}:`n$(($errors | Out-String))"
            }
            Write-Output "parsed: $Label"
          }
          Get-ChildItem scripts -Filter "*.ps1" | ForEach-Object {
            Assert-Parses $_.Name (Get-Content -Raw $_.FullName)
          }
          $bridge = Get-Content -Raw "src-tauri/src/hermes_bridge.rs"
          $match = [regex]::Match($bridge, '(?s)WINDOWS_MANAGED_HERMES_INSTALL_SCRIPT: &str = r##"(.*?)"##')
          if (!$match.Success) {
            throw "Could not locate WINDOWS_MANAGED_HERMES_INSTALL_SCRIPT in hermes_bridge.rs."
          }
          Assert-Parses "WINDOWS_MANAGED_HERMES_INSTALL_SCRIPT" $match.Groups[1].Value

      - name: Bundle Hermes runtime
        shell: pwsh
        run: ./scripts/bundle-hermes-runtime-windows.ps1

      - name: Tauri Windows bundle
        run: node scripts/tauri-build.mjs --debug --no-sign

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri/target/debug/os-june.exe" -ErrorAction Stop
          if ($exe.Length -le 0) {
            throw "Windows app executable is empty."
          }

          $setup = Get-ChildItem "src-tauri/target/debug/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) {
            throw "NSIS setup.exe was not produced."
          }
          if ($setup.Length -le 0) {
            throw "NSIS setup.exe is empty."
          }

          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) {
            throw "7-Zip was not installed at $sevenZip."
          }
          $listing = & $sevenZip l $setup.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect NSIS installer payload."
          }
          if (($listing | Measure-Object).Count -le 0) {
            throw "NSIS installer payload listing is empty."
          }
          $listingText = ($listing -join "`n").Replace("\", "/")
          foreach ($expected in @("native/hermes/bin/hermes.exe", "native/hermes/python/current/python.exe", "native/hermes/hermes-agent/pyproject.toml")) {
            if ($listingText -notmatch [regex]::Escape($expected)) {
              throw "NSIS installer payload does not include bundled Hermes file $expected."
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: june-windows-debug-nsis
          path: src-tauri/target/debug/bundle/nsis/*-setup.exe

  # The iOS project was the one target no PR ever compiled: ios-release.yml
  # runs by hand, and CLAUDE.md asked for a manual `cargo check` that nothing
  # enforced. A `cargo check --lib` per iOS target is a few minutes on a warm
  # cache and catches the two ways it usually breaks: a command missing from
  # the mobile generate_handler! list, and a desktop-only API used outside
  # a #[cfg(desktop)] gate.
  ios-check:
    name: iOS cargo check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tauri-cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-registry-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: tauri-cargo-target-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-target-${{ matrix.target }}-

      - name: Stage placeholder june-api sidecar (externalBin)
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/june-api-$(rustc -vV | sed -n 's/host: //p')"
          touch "src-tauri/binaries/june-api-${{ matrix.target }}"

      - name: cargo check (${{ matrix.target }})
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib

  # Windows had no signal on a PR either: the NSIS bundle below is manual
  # because it is slow. A `cargo check` is what catches a `cfg(windows)`
  # branch that no longer compiles, and it is cheap enough to run every time.
  windows-check:
    name: Windows cargo check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tauri-cargo-registry-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-registry-${{ runner.os }}-

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: tauri-cargo-check-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-check-${{ runner.os }}-

      - name: Stage placeholder june-api sidecar (externalBin)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/june-api-$(rustc -vV | sed -n 's/host: //p').exe"

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

# Coverage reruns of these suites live in coverage.yml (the frontend floor on every PR, the Rust floor on a clock). They
# duplicated this workflow's jobs on a macOS runner for every push and PR
# sync, gated nothing (continue-on-error), and produced artifacts nothing
# downloads — the single largest Actions line item in the repo.
