name: Upstream digest

# Sub Rosa does not merge upstream June; it reads upstream and cherry-picks
# the fixes worth having (ADR 0040). Every Monday this lists the upstream
# commits that appeared since the last review, so that reading the log is a
# task someone can see, tick off, and be reminded of. The marker
# `.github/upstream-reviewed` holds the upstream commit up to which the log
# has been read; move it forward when you have looked.
#
# The digest always lands in the run's summary and as an artifact. It is also
# filed as an issue when a token that may create one is available: the
# Actions token of this repository cannot ("Resource not accessible by
# integration" on createIssue, whatever `permissions:` says), so a
# fine-grained PAT with `issues: write` in the `DIGEST_TOKEN` secret is what
# turns the summary into an issue. Without it the job still succeeds.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-digest
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/open-software-network/os-june.git
  UPSTREAM_WEB: https://github.com/open-software-network/os-june
  MARKER_FILE: .github/upstream-reviewed
  ISSUE_TITLE: "Upstream digest: commits to read"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream --no-tags main

      - name: List the unread upstream commits
        id: list
        run: |
          set -euo pipefail
          marker="$(tr -d '[:space:]' < "$MARKER_FILE")"
          if ! git cat-file -e "$marker^{commit}" 2>/dev/null; then
            echo "The marker $marker is not an upstream commit." >&2
            exit 1
          fi
          count="$(git rev-list --count "$marker..upstream/main")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "tip=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          {
            echo "Unread upstream commits since \`$(git rev-parse --short "$marker")\` (the marker in \`$MARKER_FILE\`): **$count**."
            echo
            echo "Read them, cherry-pick what is worth having (one upstream commit per fork commit, upstream hash in the message), then move the marker to \`$(git rev-parse --short upstream/main)\` and close this issue. See ADR 0040."
            echo
            # --max-count rather than a pipe into head: with pipefail, head
            # closing the pipe early made git log exit 141 and the job fail.
            git log --reverse --max-count=400 --format="- [\`%h\`]($UPSTREAM_WEB/commit/%H) %s" "$marker..upstream/main"
            if [ "$count" -gt 400 ]; then
              echo "- … and $((count - 400)) more; move the marker to see them."
            fi
          } > digest.md
          echo "Fork is $count upstream commits behind the marker's reading."
          {
            echo "## $ISSUE_TITLE"
            echo
            cat digest.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the digest as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-digest
          path: digest.md

      - name: File or refresh the digest issue (best effort)
        if: steps.list.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.DIGEST_TOKEN || secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.list.outputs.count }}
          TIP: ${{ steps.list.outputs.tip }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          title="$ISSUE_TITLE ($COUNT, up to $TIP)"
          body="$(cat digest.md)"
          existing="$(gh api "repos/$REPO/issues?state=open&labels=upstream-digest&per_page=1" --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            if gh api -X PATCH "repos/$REPO/issues/$existing" -f title="$title" -f body="$body" >/dev/null 2>&1; then
              echo "Refreshed issue #$existing."
              exit 0
            fi
          else
            if gh api -X POST "repos/$REPO/issues" -f title="$title" -f body="$body" -f 'labels[]=upstream-digest' >/dev/null 2>&1; then
              echo "Filed the digest as an issue."
              exit 0
            fi
          fi
          echo "::warning::Could not file the digest as an issue with this token; it is in the run summary and the artifact. Add a fine-grained PAT with issues:write as DIGEST_TOKEN to have it filed."

      - name: Nothing to read
        if: steps.list.outputs.count == '0'
        run: echo "The upstream log has been read up to its tip."
