name: Upstream digest

# Sub Rosa does not merge upstream June; it reads upstream and cherry-picks
# the fixes worth having (ADR 0040). Every Monday this lists the upstream
# commits that appeared since the last review in one issue, so that reading
# the log is a task someone can see, close, and be reminded of. The marker
# `.github/upstream-reviewed` holds the upstream commit up to which the log
# has been read; move it forward when you have looked.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-digest
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/open-software-network/os-june.git
  UPSTREAM_WEB: https://github.com/open-software-network/os-june
  MARKER_FILE: .github/upstream-reviewed
  ISSUE_TITLE: "Upstream digest: commits to read"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream --no-tags main

      - name: List the unread upstream commits
        id: list
        run: |
          set -euo pipefail
          marker="$(tr -d '[:space:]' < "$MARKER_FILE")"
          if ! git cat-file -e "$marker^{commit}" 2>/dev/null; then
            echo "The marker $marker is not an upstream commit." >&2
            exit 1
          fi
          count="$(git rev-list --count "$marker..upstream/main")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "tip=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          echo "marker=$(git rev-parse --short "$marker")" >> "$GITHUB_OUTPUT"
          {
            echo "Unread upstream commits since \`$(git rev-parse --short "$marker")\` (the marker in \`$MARKER_FILE\`): **$count**."
            echo
            echo "Read them, cherry-pick what is worth having (one upstream commit per fork commit, upstream hash in the message), then move the marker to \`$(git rev-parse --short upstream/main)\` and close this issue. See ADR 0040."
            echo
            # --max-count rather than a pipe into head: with pipefail, head
            # closing the pipe early made git log exit 141 and the job fail.
            git log --reverse --max-count=400 --format="- [\`%h\`]($UPSTREAM_WEB/commit/%H) %s" "$marker..upstream/main"
            if [ "$count" -gt 400 ]; then
              echo "- … and $((count - 400)) more; move the marker to see them."
            fi
          } > digest.md
          echo "Fork is $count upstream commits behind the marker's reading."

      - name: Open or refresh the digest issue
        if: steps.list.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.list.outputs.count }}
          TIP: ${{ steps.list.outputs.tip }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --search "\"$ISSUE_TITLE\" in:title" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file digest.md --title "$ISSUE_TITLE ($COUNT, up to $TIP)"
            echo "Refreshed issue #$existing."
          else
            gh issue create --title "$ISSUE_TITLE ($COUNT, up to $TIP)" --body-file digest.md --label upstream-digest ||
              gh issue create --title "$ISSUE_TITLE ($COUNT, up to $TIP)" --body-file digest.md
          fi

      - name: Nothing to read
        if: steps.list.outputs.count == '0'
        run: echo "The upstream log has been read up to its tip."
