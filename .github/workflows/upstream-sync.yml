name: Upstream sync

# Keeps the Sub Rosa fork tracking upstream June (open-software-network/os-june).
# Weekly (and on demand) it fetches upstream, and — when there are new commits —
# opens/updates a PR from an `upstream-sync` branch into `main`. Conflicts are
# surfaced in the PR for a human to resolve (we never auto-merge a conflicting
# upstream, per FORK_NOTES). A clean PR can be merged once CI is green.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/open-software-network/os-june.git
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream --no-tags

      - name: Determine whether upstream has new commits
        id: check
        run: |
          behind="$(git rev-list --count HEAD..upstream/main)"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Fork is $behind commits behind upstream/main."

      - name: Push upstream/main to the sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          # Fast-forward the sync branch to the current upstream tip. The PR
          # (sync branch -> main) shows the full upstream diff; GitHub flags any
          # conflicts for manual resolution.
          git push --force origin "refs/remotes/upstream/main:refs/heads/${SYNC_BRANCH}"

      - name: Open or update the sync PR
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream_sha="$(git rev-parse --short upstream/main)"
          title="chore: sync upstream June (${upstream_sha})"
          body=$(cat <<EOF
          Automated upstream sync from \`open-software-network/os-june@${upstream_sha}\`.

          - The fork is **${{ steps.check.outputs.behind }}** commits behind upstream/main.
          - Review the diff, resolve any conflicts (see \`FORK_NOTES.md\` for the
            files the fork owns: branding, \`carpe_diem/\`, \`tauri.conf.json\`,
            \`lib.rs\`, updater config), and merge once CI is green.
          - **Do not blind-merge**: keep the Sub Rosa branding + Carpe Diem sidecar.

          Generated by \`.github/workflows/upstream-sync.yml\`.
          EOF
          )
          existing="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated existing sync PR #$existing."
          else
            gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body "$body" --label upstream-sync || \
              gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body "$body"
          fi

      - name: Nothing to do
        if: steps.check.outputs.behind == '0'
        run: echo "Fork is up to date with upstream/main."
