name: iOS release (TestFlight)

# Builds the iOS app (App Store signing) and uploads the IPA to App Store
# Connect / TestFlight. Manual dispatch while the lane stabilizes; wire it to
# tags once two runs have passed cleanly.
#
# Required secrets (see HANDOFF.md §9):
# - APPLE_API_KEY_ID       App Store Connect API key id (e.g. 2X9R4HXF34)
# - APPLE_API_ISSUER       App Store Connect issuer id (UUID)
# - APPLE_API_KEY_P8       The AuthKey_<id>.p8 content, base64-encoded
# - APPLE_TEAM_ID          Already set for macOS signing (H6N5V777LL)
# - IOS_DIST_CERT_P12      Apple Distribution certificate, base64 .p12
# - IOS_DIST_CERT_PASSWORD Password for the imported .p12
#
# Fallback secrets, read only when App Store Connect cannot give a profile:
# - IOS_PROVISION_PROFILE, IOS_SHARE_PROVISION_PROFILE,
#   IOS_WIDGETS_PROVISION_PROFILE, IOS_WATCH_PROVISION_PROFILE,
#   IOS_WATCH_WIDGETS_PROVISION_PROFILE (base64 .mobileprovision)
#
# Signing imports the distribution identity, then scripts/ios-provision.mjs
# gets one App Store profile per bundle through the App Store Connect REST API
# (ADR-0048, ADR-0095, ADR-0099): it registers missing bundle ids, turns on
# HealthKit for the app, and makes a profile with the imported certificate
# when one is missing or stale. A bundle it cannot sign is left out of the
# archive with a warning; only the app is required. The App Group's
# association with the app and the share extension is the one portal step the
# API cannot take. The key's App Manager role allows all of this through the
# REST API, but not xcodebuild cloud signing.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (default: main)"
        required: false
        default: "main"
      upload:
        description: "Upload to TestFlight (disable to verify signing and export only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-upload:
    # macos-15 ships Xcode 16.x: the committed gen/apple project is saved in the
    # Xcode 16 project format (objectVersion 77), which Xcode 15.4 on macos-14
    # cannot open ("future Xcode project file format").
    runs-on: macos-15
    steps:
      # Dispatch inputs come from maintainers, but validate anyway before the
      # value reaches checkout (same discipline as release.yml's tag guard).
      - name: Validate ref input
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if ! printf '%s' "$INPUT_REF" | grep -qE '^[A-Za-z0-9._/-]{1,120}$'; then
            echo "Refusing suspicious ref: $INPUT_REF" >&2; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}

      # Pick the newest installed Xcode. Apple requires the iOS 26 SDK (Xcode 26+)
      # for App Store / TestFlight uploads — an older Xcode archives fine but the
      # upload is rejected with an SDK-version validation error. macos-15 ships
      # Xcode 26.x (not as default), so select the highest and hard-fail if < 26.
      - name: Select latest Xcode
        run: |
          # shellcheck disable=SC2012 # runner image paths have no odd characters
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "No Xcode found under /Applications." >&2; exit 1; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "Xcode >= 26 (iOS 26 SDK) required for App Store upload; got $MAJOR." >&2
            exit 1
          fi

      # The watch app's asset catalog (ADR-0095) is compiled by an actool that
      # needs the watchOS platform installed, device build included. Runner
      # images usually carry it; fetch it when this one does not.
      - name: Make sure the watchOS platform is installed
        run: |
          if xcrun simctl list runtimes | grep -q 'watchOS'; then
            echo "watchOS runtime present."
          else
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Setup Node + pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "src-tauri -> target\njune-api -> target"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing APPLE_API_KEY_ID / APPLE_API_KEY_P8 secrets." >&2; exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > ~/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8"

      # Manual App Store signing: import the Apple Distribution identity into a
      # dedicated keychain and install the App Store provisioning profile. The
      # App Store Connect *App Manager* key cannot do xcodebuild cloud signing
      # (it can't create the distribution cert/profile on the fly — "Cloud
      # signing permission error"), so we sign against pre-provisioned assets.
      - name: Import signing certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "${IOS_DIST_CERT_P12:-}" ]; then
            echo "Missing IOS_DIST_CERT_P12 secret." >&2; exit 1
          fi
          KC="$RUNNER_TEMP/sr-ios-sign.keychain-db"
          KCPASS=$(openssl rand -base64 24)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          # Keep the login keychain in the search list; add ours and make it default.
          # shellcheck disable=SC2046 # each existing keychain is its own argument
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          security find-identity -v -p codesigning "$KC"
          # The serial tells the API which distribution certificate the
          # profiles must hold: the one whose private key is in this keychain.
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KC" \
            | openssl x509 -noout -serial 2>/dev/null || true)
          echo "IOS_DIST_CERT_SERIAL=${SERIAL#serial=}" >> "$GITHUB_ENV"

      # One App Store profile per bundle, from App Store Connect: bundle ids
      # registered and HealthKit turned on when missing, a profile made (or
      # remade, when a capability came after it) with the imported
      # certificate. The old profile secrets are read only when the API gives
      # nothing; a bundle left without a profile is dropped from the archive
      # below. Writes $RUNNER_TEMP/<bundle>-profile.plist and the manifest the
      # export reads, and exports IOS_DROPPED_BUNDLES / IOS_EXPECTED_BUNDLES.
      - name: Get the App Store profiles
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
          IOS_SHARE_PROVISION_PROFILE: ${{ secrets.IOS_SHARE_PROVISION_PROFILE }}
          IOS_WIDGETS_PROVISION_PROFILE: ${{ secrets.IOS_WIDGETS_PROVISION_PROFILE }}
          IOS_WATCH_PROVISION_PROFILE: ${{ secrets.IOS_WATCH_PROVISION_PROFILE }}
          IOS_WATCH_WIDGETS_PROVISION_PROFILE: ${{ secrets.IOS_WATCH_WIDGETS_PROVISION_PROFILE }}
        run: node scripts/ios-provision.mjs provision

      # Archive through the Tauri CLI (not a raw `xcodebuild archive`): the Xcode
      # "Build Rust Code" phase runs `tauri ios xcode-script`, which needs the
      # `<identifier>-server-addr` file that only `tauri ios build`/`dev` writes —
      # a direct xcodebuild archive panics on the missing file. Tauri's OWN
      # export/signing is unreliable (it falls back to an "Apple Distribution:
      # Tauri (unset)" cert with the team unset), so we let it archive and export
      # the resulting xcarchive ourselves below. Tolerate Tauri's export failure
      # as long as it leaves a valid xcarchive.
      # Health (ADR-0099) needs the HealthKit capability on the App ID and a
      # profile that carries it. The step above turns it on and remakes the
      # profile; should either fail, ship without it rather than fail the
      # export: the app then says Health is unavailable instead of reading it.
      - name: Keep HealthKit only when the profile allows it
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          profile = plistlib.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "app-profile.plist").read_bytes())
          path = pathlib.Path("src-tauri/gen/apple/os-june_iOS/os-june_iOS.entitlements")
          entitlements = plistlib.loads(path.read_bytes())
          if "com.apple.developer.healthkit" in profile.get("Entitlements", {}):
              print("HealthKit: the profile carries it.")
          else:
              for key in ("com.apple.developer.healthkit", "com.apple.developer.healthkit.access"):
                  entitlements.pop(key, None)
              path.write_bytes(plistlib.dumps(entitlements))
              print("::warning::The app profile has no HealthKit capability; this build ships without Health (HANDOFF.md).")
          PY

      - name: Stamp the iOS bundles with the app version
        # The run number is the build counter. Apple refuses a CFBundleVersion it
        # has already seen, so a delivery rejected for any reason could never be
        # sent again if the build number were the app version.
        env:
          SUBROSA_IOS_BUILD: ${{ github.run_number }}
        run: |
          node scripts/sync-ios-version.mjs
          git --no-pager diff --stat -- src-tauri/gen/apple || true

      # Google, Microsoft and GitHub sign in with client ids compiled into the
      # app; a build without one ships without that connector. Annotate the
      # run with each one left out, and register Google's redirect scheme (its
      # reversed client id) in the Info.plist through a config overlay, which
      # `tauri ios xcode-script` forwards to the deep-link plugin's build.
      - name: Connector clients
        env:
          SUBROSA_GOOGLE_CLIENT_ID: ${{ secrets.SUBROSA_GOOGLE_CLIENT_ID }}
          SUBROSA_MS_CLIENT_ID: ${{ secrets.SUBROSA_MS_CLIENT_ID }}
          SUBROSA_GITHUB_CLIENT_ID: ${{ secrets.SUBROSA_GITHUB_CLIENT_ID }}
        run: node scripts/connector-clients.mjs build --platform ios --overlay connector-clients.conf.json

      - name: Archive via Tauri (Rust build + xcarchive)
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SUBROSA_GOOGLE_CLIENT_ID: ${{ secrets.SUBROSA_GOOGLE_CLIENT_ID }}
          SUBROSA_MS_CLIENT_ID: ${{ secrets.SUBROSA_MS_CLIENT_ID }}
          SUBROSA_GITHUB_CLIENT_ID: ${{ secrets.SUBROSA_GITHUB_CLIENT_ID }}
        run: |
          pnpm tauri ios build --export-method app-store-connect --verbose --config connector-clients.conf.json || \
            echo "Tauri's own export failed (expected); exporting the xcarchive manually."

      # The watch app is not part of Tauri's build: Tauri passes `-sdk
      # iphoneos` to xcodebuild, which forces every dependency of the app onto
      # the iPhone SDK, and watchOS code does not compile there (run
      # 37847393168). So the app target leaves it out (project.yml) and it is
      # built here for watchOS, its complication inside it, with the same
      # unsigned `release` configuration as the rest of the archive; `install`
      # gives the stripped product an archive would hold, with both watch
      # architectures and no destination to resolve. It goes where Xcode
      # embeds a single-target watch app, and the export signs it with the
      # watch profiles like every other bundle. Without a watch profile there
      # is nothing to sign it with, so the build ships without it.
      - name: Put the watch app in the archive
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name '*.xcarchive' -print | head -1)
          if [ -z "$ARCHIVE" ]; then echo "No xcarchive produced by Tauri." >&2; exit 1; fi
          for dropped in ${IOS_DROPPED_BUNDLES:-}; do
            if [ "$dropped" = "xyz.carpediem.subrosa.watchkitapp" ]; then
              echo "The watch app has no App Store profile; not building it."; exit 0
            fi
          done
          WATCH="$RUNNER_TEMP/watch"
          xcodebuild -project src-tauri/gen/apple/os-june.xcodeproj \
            -target os-june_Watch -sdk watchos -configuration release install \
            DSTROOT="$WATCH/dst" SYMROOT="$WATCH/sym" OBJROOT="$WATCH/obj" \
            CODE_SIGNING_ALLOWED=NO
          BUILT="$WATCH/dst/Applications/SubRosaWatch.app"
          if [ ! -f "$BUILT/Info.plist" ]; then echo "The watch build left no SubRosaWatch.app." >&2; exit 1; fi
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print | head -1)
          rm -rf "$APP/Watch"
          mkdir -p "$APP/Watch"
          ditto "$BUILT" "$APP/Watch/SubRosaWatch.app"
          mkdir -p "$ARCHIVE/dSYMs"
          for dsym in "$WATCH"/sym/release-watchos/*.dSYM; do
            [ -d "$dsym" ] && ditto "$dsym" "$ARCHIVE/dSYMs/$(basename "$dsym")"
          done
          find "$APP/Watch" -maxdepth 3 -name Info.plist -print

      # A bundle without a profile cannot be signed by the export, so it
      # leaves the archive here, loudly, and the app ships without it. The
      # export re-signs the app, so its seal no longer lists what was removed.
      - name: Leave out the bundles that have no profile
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name '*.xcarchive' -print | head -1)
          if [ -z "$ARCHIVE" ]; then echo "No xcarchive produced by Tauri." >&2; exit 1; fi
          if [ -z "${IOS_DROPPED_BUNDLES:-}" ]; then
            echo "Every bundle has its profile."; exit 0
          fi
          for bundle in "$ARCHIVE"/Products/Applications/*.app/PlugIns/*.appex \
                        "$ARCHIVE"/Products/Applications/*.app/Watch/*.app \
                        "$ARCHIVE"/Products/Applications/*.app/Watch/*.app/PlugIns/*.appex; do
            [ -f "$bundle/Info.plist" ] || continue
            id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$bundle/Info.plist")
            for dropped in $IOS_DROPPED_BUNDLES; do
              if [ "$id" = "$dropped" ]; then
                rm -rf "$bundle"
                echo "::warning::Left $id out of this build: it has no App Store profile."
              fi
            done
          done
          for watch_dir in "$ARCHIVE"/Products/Applications/*.app/Watch; do
            [ -d "$watch_dir" ] && rmdir "$watch_dir" 2>/dev/null || true
          done

      # Tauri's archive rewrites CFBundleVersion from tauri.conf.json ("Updated
      # CFBundleVersion ... to 1.65.2"), undoing the stamp above, so the counter
      # has to be written into the archive itself. Export re-signs the bundle and
      # sets manageAppVersionAndBuildNumber to false, so it keeps what is written
      # here.
      - name: Stamp the build number into the archive
        env:
          SUBROSA_IOS_BUILD: ${{ github.run_number }}
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name '*.xcarchive' -print | head -1)
          if [ -z "$ARCHIVE" ]; then echo "No xcarchive produced by Tauri." >&2; exit 1; fi
          BUILD=$(node scripts/print-ios-build.mjs)
          echo "Build number for this delivery: $BUILD"
          stamped=0
          for plist in "$ARCHIVE"/Products/Applications/*.app/Info.plist \
                       "$ARCHIVE"/Products/Applications/*.app/PlugIns/*.appex/Info.plist \
                       "$ARCHIVE"/Products/Applications/*.app/Watch/*.app/Info.plist \
                       "$ARCHIVE"/Products/Applications/*.app/Watch/*.app/PlugIns/*.appex/Info.plist; do
            [ -f "$plist" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$plist"
            echo "  $plist -> $BUILD"
            stamped=$((stamped + 1))
          done
          # The app, its share extension, its widgets, the watch app and its
          # complication, less any left out above. Fewer means the archive
          # layout moved and the delivery would go out carrying the version it
          # must not reuse (a watch app's build number must also equal its
          # iPhone app's).
          expected="${IOS_EXPECTED_BUNDLES:-5}"
          if [ "$stamped" -lt "$expected" ]; then
            echo "::error::Stamped $stamped bundles, expected $expected (the app and the bundles that have a profile)" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD" \
            "$ARCHIVE/Info.plist" || true
          # Tauri archives with one architecture; a watch app also wants
          # arm64_32 for the watches before Series 9 (ADR-0095). Say so loudly
          # rather than ship a watch app most watches cannot install.
          for watch_bin in "$ARCHIVE"/Products/Applications/*.app/Watch/*.app/SubRosaWatch; do
            [ -f "$watch_bin" ] || continue
            archs=$(lipo -archs "$watch_bin")
            echo "Watch app architectures: $archs"
            case " $archs " in
              *" arm64_32 "*) ;;
              *) echo "::warning::The watch app was archived without arm64_32 ($archs)." ;;
            esac
          done

      # Re-sign with the imported identity and installed App Store profiles.
      # The ExportOptions map each bundle kept to its profile by name; a
      # profile from an old secret that Xcode manages switches the export to
      # automatic selection (scripts/ios-signing.mjs, exportOptions).
      # No provisioning updates or cloud credentials are granted to this step.
      - name: Export IPA (installed App Store signing assets)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name '*.xcarchive' -print | head -1)
          if [ -z "$ARCHIVE" ]; then echo "No xcarchive produced by Tauri." >&2; exit 1; fi
          echo "Exporting archive: $ARCHIVE"
          mkdir -p build
          node scripts/ios-provision.mjs export-options build/ExportOptions-asc.plist
          plutil -lint build/ExportOptions-asc.plist
          cat build/ExportOptions-asc.plist
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist build/ExportOptions-asc.plist \
            -exportPath build/export

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          IPA=$(find build/export src-tauri/gen/apple/build -name '*.ipa' -print | head -1)
          if [ -z "$IPA" ]; then echo "No .ipa to upload." >&2; exit 1; fi
          echo "Uploading $IPA to TestFlight"
          # altool reads the key from ~/private_keys/AuthKey_<APPLE_API_KEY_ID>.p8.
          # It prints its rejections and still exits zero, which once let a whole
          # release report success while App Store Connect had refused the build.
          # Read the verdict rather than the exit code.
          set +e
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER" \
            --output-format json >altool.json 2>altool.log
          status=$?
          set -e
          cat altool.log
          cat altool.json
          if [ "$status" -ne 0 ] || grep -q '"product-errors"' altool.json \
            || grep -qE '^[0-9-]+ [0-9:.]+ ERROR' altool.log; then
            echo "::error::App Store Connect refused the upload" >&2
            exit 1
          fi
