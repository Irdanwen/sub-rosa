name: iOS release (TestFlight)

# Builds the iOS app (App Store signing) and uploads the IPA to App Store
# Connect / TestFlight. Manual dispatch while the lane stabilizes; wire it to
# tags once two runs have passed cleanly.
#
# Required secrets (see HANDOFF.md §7):
# - APPLE_API_KEY_ID       App Store Connect API key id (e.g. 2X9R4HXF34)
# - APPLE_API_ISSUER       App Store Connect issuer id (UUID)
# - APPLE_API_KEY_P8       The AuthKey_<id>.p8 content, base64-encoded
# - APPLE_TEAM_ID          Already set for macOS signing (H6N5V777LL)
#
# Signing uses Xcode cloud-managed certificates: with the API key,
# `-allowProvisioningUpdates` creates/fetches the Apple Distribution
# certificate and App Store profile on the runner — no .p12 to maintain.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (default: main)"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-upload:
    # macos-15 ships Xcode 16.x: the committed gen/apple project is saved in the
    # Xcode 16 project format (objectVersion 77), which Xcode 15.4 on macos-14
    # cannot open ("future Xcode project file format").
    runs-on: macos-15
    steps:
      # Dispatch inputs come from maintainers, but validate anyway before the
      # value reaches checkout (same discipline as release.yml's tag guard).
      - name: Validate ref input
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if ! printf '%s' "$INPUT_REF" | grep -qE '^[A-Za-z0-9._/-]{1,120}$'; then
            echo "Refusing suspicious ref: $INPUT_REF" >&2; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Setup Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target\njune-api -> target"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing APPLE_API_KEY_ID / APPLE_API_KEY_P8 secrets." >&2; exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      # Archive through the Tauri CLI (not a raw `xcodebuild archive`): the Xcode
      # "Build Rust Code" phase runs `tauri ios xcode-script`, which needs the
      # `<identifier>-server-addr` file that only `tauri ios build`/`dev` writes —
      # a direct xcodebuild archive panics on the missing file. Tauri's OWN
      # export/signing is unreliable (it falls back to an "Apple Distribution:
      # Tauri (unset)" cert with the team unset), so we let it archive and export
      # the resulting xcarchive ourselves below. Tolerate Tauri's export failure
      # as long as it leaves a valid xcarchive.
      - name: Archive via Tauri (Rust build + xcarchive)
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm tauri ios build --export-method app-store-connect --verbose || \
            echo "Tauri's own export failed (expected); exporting the xcarchive manually."

      # Export the archive with xcodebuild's native App Store cloud signing:
      # -allowProvisioningUpdates + the ASC API key let Xcode create/download the
      # Apple Distribution cert and App Store profile for the bundle id, then
      # re-sign the app for upload (replacing Tauri's placeholder signature).
      - name: Export IPA (App Store cloud signing)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name '*.xcarchive' -print | head -1)
          if [ -z "$ARCHIVE" ]; then echo "No xcarchive produced by Tauri." >&2; exit 1; fi
          echo "Exporting archive: $ARCHIVE"
          mkdir -p build
          cat > build/ExportOptions-asc.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist build/ExportOptions-asc.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath /Users/runner/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          IPA=$(find build/export src-tauri/gen/apple/build -name '*.ipa' -print | head -1)
          if [ -z "$IPA" ]; then echo "No .ipa to upload." >&2; exit 1; fi
          echo "Uploading $IPA to TestFlight"
          # altool reads the key from ~/private_keys/AuthKey_<APPLE_API_KEY_ID>.p8
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
