name: iOS release (TestFlight)

# Builds the iOS app (App Store signing) and uploads the IPA to App Store
# Connect / TestFlight. Manual dispatch while the lane stabilizes; wire it to
# tags once two runs have passed cleanly.
#
# Required secrets (see HANDOFF.md §9 and the share-extension section):
# - APPLE_API_KEY_ID       App Store Connect API key id (e.g. 2X9R4HXF34)
# - APPLE_API_ISSUER       App Store Connect issuer id (UUID)
# - APPLE_API_KEY_P8       The AuthKey_<id>.p8 content, base64-encoded
# - APPLE_TEAM_ID          Already set for macOS signing (H6N5V777LL)
# - IOS_DIST_CERT_P12      Apple Distribution certificate, base64 .p12
# - IOS_DIST_CERT_PASSWORD Password for the imported .p12
# - IOS_PROVISION_PROFILE  App Store profile for the app, base64
# - IOS_SHARE_PROVISION_PROFILE App Store profile for the share extension, base64
# - IOS_WIDGETS_PROVISION_PROFILE App Store profile for the widgets
#                          (xyz.carpediem.subrosa.widgets, with the App Group)
# - IOS_WATCH_PROVISION_PROFILE App Store profile for the watch app
#                          (xyz.carpediem.subrosa.watchkitapp)
# - IOS_WATCH_WIDGETS_PROVISION_PROFILE App Store profile for the watch face
#                          complication (xyz.carpediem.subrosa.watchkitapp.widgets)
#
# Signing imports the distribution identity and the five provisioning profiles
# (ADR-0048, ADR-0095). Export uses manual signing; the app, share extension
# and widgets profiles must authorize the shared App Group.
# The API key authenticates App Store Connect access/upload, not cloud signing.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (default: main)"
        required: false
        default: "main"
      upload:
        description: "Upload to TestFlight (disable to verify signing and export only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-upload:
    # macos-15 ships Xcode 16.x: the committed gen/apple project is saved in the
    # Xcode 16 project format (objectVersion 77), which Xcode 15.4 on macos-14
    # cannot open ("future Xcode project file format").
    runs-on: macos-15
    steps:
      # Dispatch inputs come from maintainers, but validate anyway before the
      # value reaches checkout (same discipline as release.yml's tag guard).
      - name: Validate ref input
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if ! printf '%s' "$INPUT_REF" | grep -qE '^[A-Za-z0-9._/-]{1,120}$'; then
            echo "Refusing suspicious ref: $INPUT_REF" >&2; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.inputs.ref }}

      # Pick the newest installed Xcode. Apple requires the iOS 26 SDK (Xcode 26+)
      # for App Store / TestFlight uploads — an older Xcode archives fine but the
      # upload is rejected with an SDK-version validation error. macos-15 ships
      # Xcode 26.x (not as default), so select the highest and hard-fail if < 26.
      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "No Xcode found under /Applications." >&2; exit 1; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          MAJOR=$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "Xcode >= 26 (iOS 26 SDK) required for App Store upload; got $MAJOR." >&2
            exit 1
          fi

      # The watch app's asset catalog (ADR-0095) is compiled by an actool that
      # needs the watchOS platform installed, device build included. Runner
      # images usually carry it; fetch it when this one does not.
      - name: Make sure the watchOS platform is installed
        run: |
          if xcrun simctl list runtimes | grep -q 'watchOS'; then
            echo "watchOS runtime present."
          else
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Setup Node + pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "src-tauri -> target\njune-api -> target"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "Missing APPLE_API_KEY_ID / APPLE_API_KEY_P8 secrets." >&2; exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      # Manual App Store signing: import the Apple Distribution identity into a
      # dedicated keychain and install the App Store provisioning profile. The
      # App Store Connect *App Manager* key cannot do xcodebuild cloud signing
      # (it can't create the distribution cert/profile on the fly — "Cloud
      # signing permission error"), so we sign against pre-provisioned assets.
      - name: Import signing certificate + provisioning profile
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
          IOS_SHARE_PROVISION_PROFILE: ${{ secrets.IOS_SHARE_PROVISION_PROFILE }}
          IOS_WIDGETS_PROVISION_PROFILE: ${{ secrets.IOS_WIDGETS_PROVISION_PROFILE }}
          IOS_WATCH_PROVISION_PROFILE: ${{ secrets.IOS_WATCH_PROVISION_PROFILE }}
          IOS_WATCH_WIDGETS_PROVISION_PROFILE: ${{ secrets.IOS_WATCH_WIDGETS_PROVISION_PROFILE }}
        run: |
          if [ -z "${IOS_DIST_CERT_P12:-}" ] || [ -z "${IOS_PROVISION_PROFILE:-}" ]; then
            echo "Missing IOS_DIST_CERT_P12 / IOS_PROVISION_PROFILE secrets." >&2; exit 1
          fi
          # The share extension (ADR-0048) is its own bundle and needs its own
          # App Store profile, with the app group on it. HANDOFF.md says how to
          # make one; without it the export below cannot sign the extension.
          if [ -z "${IOS_SHARE_PROVISION_PROFILE:-}" ]; then
            echo "Missing IOS_SHARE_PROVISION_PROFILE (the share extension's profile, see HANDOFF.md)." >&2; exit 1
          fi
          # The widgets, the watch app and its complication (ADR-0095) are
          # three more bundles, each with its own profile (HANDOFF.md §10).
          for name in IOS_WIDGETS_PROVISION_PROFILE IOS_WATCH_PROVISION_PROFILE IOS_WATCH_WIDGETS_PROVISION_PROFILE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing $name (see HANDOFF.md, widgets and Apple Watch)." >&2; exit 1
            fi
          done
          KC="$RUNNER_TEMP/sr-ios-sign.keychain-db"
          KCPASS=$(openssl rand -base64 24)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          # Keep the login keychain in the search list; add ours and make it default.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          security find-identity -v -p codesigning "$KC"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          printf '%s' "$IOS_PROVISION_PROFILE" | base64 --decode > "$PROFILES_DIR/subrosa-appstore.mobileprovision"
          printf '%s' "$IOS_SHARE_PROVISION_PROFILE" | base64 --decode > "$PROFILES_DIR/subrosa-share-appstore.mobileprovision"
          printf '%s' "$IOS_WIDGETS_PROVISION_PROFILE" | base64 --decode > "$PROFILES_DIR/subrosa-widgets-appstore.mobileprovision"
          printf '%s' "$IOS_WATCH_PROVISION_PROFILE" | base64 --decode > "$PROFILES_DIR/subrosa-watch-appstore.mobileprovision"
          printf '%s' "$IOS_WATCH_WIDGETS_PROVISION_PROFILE" | base64 --decode > "$PROFILES_DIR/subrosa-watch-widgets-appstore.mobileprovision"
          # Profiles renewed through Xcode have managed names. Resolve the
          # installed UUIDs instead of requiring a portal-created display name.
          APP_PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/subrosa-appstore.mobileprovision" | plutil -extract UUID raw -o - -)
          SHARE_PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/subrosa-share-appstore.mobileprovision" | plutil -extract UUID raw -o - -)
          echo "IOS_PROFILE_UUID=$APP_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_SHARE_PROFILE_UUID=$SHARE_PROFILE_UUID" >> "$GITHUB_ENV"
          security cms -D -i "$PROFILES_DIR/subrosa-appstore.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$PROFILES_DIR/subrosa-share-appstore.mobileprovision" > "$RUNNER_TEMP/share-profile.plist"
          for part in widgets watch watch-widgets; do
            security cms -D -i "$PROFILES_DIR/subrosa-$part-appstore.mobileprovision" > "$RUNNER_TEMP/$part-profile.plist"
          done

      # Archive through the Tauri CLI (not a raw `xcodebuild archive`): the Xcode
      # "Build Rust Code" phase runs `tauri ios xcode-script`, which needs the
      # `<identifier>-server-addr` file that only `tauri ios build`/`dev` writes —
      # a direct xcodebuild archive panics on the missing file. Tauri's OWN
      # export/signing is unreliable (it falls back to an "Apple Distribution:
      # Tauri (unset)" cert with the team unset), so we let it archive and export
      # the resulting xcarchive ourselves below. Tolerate Tauri's export failure
      # as long as it leaves a valid xcarchive.
      # Health (ADR-0099) needs the HealthKit capability on the App ID and a
      # profile that carries it. Until the owner has enabled it and refreshed
      # IOS_PROVISION_PROFILE, ship without it rather than fail the export:
      # the app then says Health is unavailable instead of reading it.
      - name: Keep HealthKit only when the profile allows it
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          profile = plistlib.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "app-profile.plist").read_bytes())
          path = pathlib.Path("src-tauri/gen/apple/os-june_iOS/os-june_iOS.entitlements")
          entitlements = plistlib.loads(path.read_bytes())
          if "com.apple.developer.healthkit" in profile.get("Entitlements", {}):
              print("HealthKit: the profile carries it.")
          else:
              for key in ("com.apple.developer.healthkit", "com.apple.developer.healthkit.access"):
                  entitlements.pop(key, None)
              path.write_bytes(plistlib.dumps(entitlements))
              print("::warning::The app profile has no HealthKit capability; this build ships without Health (HANDOFF.md).")
          PY

      - name: Stamp the iOS bundles with the app version
        # The run number is the build counter. Apple refuses a CFBundleVersion it
        # has already seen, so a delivery rejected for any reason could never be
        # sent again if the build number were the app version.
        env:
          SUBROSA_IOS_BUILD: ${{ github.run_number }}
        run: |
          node scripts/sync-ios-version.mjs
          git --no-pager diff --stat -- src-tauri/gen/apple || true

      - name: Archive via Tauri (Rust build + xcarchive)
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm tauri ios build --export-method app-store-connect --verbose || \
            echo "Tauri's own export failed (expected); exporting the xcarchive manually."

      # Tauri's archive rewrites CFBundleVersion from tauri.conf.json ("Updated
      # CFBundleVersion ... to 1.65.2"), undoing the stamp above, so the counter
      # has to be written into the archive itself. Export re-signs the bundle and
      # sets manageAppVersionAndBuildNumber to false, so it keeps what is written
      # here.
      - name: Stamp the build number into the archive
        env:
          SUBROSA_IOS_BUILD: ${{ github.run_number }}
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name '*.xcarchive' -print | head -1)
          if [ -z "$ARCHIVE" ]; then echo "No xcarchive produced by Tauri." >&2; exit 1; fi
          BUILD=$(node scripts/print-ios-build.mjs)
          echo "Build number for this delivery: $BUILD"
          stamped=0
          for plist in "$ARCHIVE"/Products/Applications/*.app/Info.plist \
                       "$ARCHIVE"/Products/Applications/*.app/PlugIns/*.appex/Info.plist \
                       "$ARCHIVE"/Products/Applications/*.app/Watch/*.app/Info.plist \
                       "$ARCHIVE"/Products/Applications/*.app/Watch/*.app/PlugIns/*.appex/Info.plist; do
            [ -f "$plist" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$plist"
            echo "  $plist -> $BUILD"
            stamped=$((stamped + 1))
          done
          # The app, its share extension, its widgets, the watch app and its
          # complication. Fewer means the archive layout moved and the delivery
          # would go out carrying the version it must not reuse (a watch app's
          # build number must also equal its iPhone app's).
          if [ "$stamped" -lt 5 ]; then
            echo "::error::Stamped $stamped bundles, expected the app, its two extensions, the watch app and its complication" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD" \
            "$ARCHIVE/Info.plist" || true
          # Tauri archives with one architecture; a watch app also wants
          # arm64_32 for the watches before Series 9 (ADR-0095). Say so loudly
          # rather than ship a watch app most watches cannot install.
          for watch_bin in "$ARCHIVE"/Products/Applications/*.app/Watch/*.app/SubRosaWatch; do
            [ -f "$watch_bin" ] || continue
            archs=$(lipo -archs "$watch_bin")
            echo "Watch app architectures: $archs"
            case " $archs " in
              *" arm64_32 "*) ;;
              *) echo "::warning::The watch app was archived without arm64_32 ($archs)." ;;
            esac
          done

      # Re-sign with the imported identity and installed App Store profiles.
      # Match the signing style to the profile origin: Xcode-managed profiles
      # require automatic selection, portal-created profiles allow UUID mapping.
      # No provisioning updates or cloud credentials are granted to this step.
      - name: Export IPA (installed App Store signing assets)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ARCHIVE=$(find src-tauri/gen/apple/build -name '*.xcarchive' -print | head -1)
          if [ -z "$ARCHIVE" ]; then echo "No xcarchive produced by Tauri." >&2; exit 1; fi
          echo "Exporting archive: $ARCHIVE"
          mkdir -p build
          python3 - <<'PY'
          import os, pathlib, plistlib
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          names = ("app", "share", "widgets", "watch", "watch-widgets")
          profiles = [plistlib.loads((temp / f"{name}-profile.plist").read_bytes()) for name in names]
          # Xcode rejects managed profiles under manual signing even when
          # their UUID and certificate match. Automatic selection can reuse
          # these installed profiles and the imported distribution identity.
          managed = any(profile.get("IsXcodeManaged", False) for profile in profiles)
          options = {
              "method": "app-store-connect", "destination": "export",
              "signingStyle": "automatic" if managed else "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "manageAppVersionAndBuildNumber": False,
          }
          if not managed:
              options["signingCertificate"] = "Apple Distribution"
              bundles = ("xyz.carpediem.subrosa", "xyz.carpediem.subrosa.share",
                         "xyz.carpediem.subrosa.widgets", "xyz.carpediem.subrosa.watchkitapp",
                         "xyz.carpediem.subrosa.watchkitapp.widgets")
              options["provisioningProfiles"] = {
                  bundle: profile["UUID"] for bundle, profile in zip(bundles, profiles)
              }
          pathlib.Path("build/ExportOptions-asc.plist").write_bytes(plistlib.dumps(options))
          print("Export signing style:", options["signingStyle"])
          PY
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist build/ExportOptions-asc.plist \
            -exportPath build/export

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          IPA=$(find build/export src-tauri/gen/apple/build -name '*.ipa' -print | head -1)
          if [ -z "$IPA" ]; then echo "No .ipa to upload." >&2; exit 1; fi
          echo "Uploading $IPA to TestFlight"
          # altool reads the key from ~/private_keys/AuthKey_<APPLE_API_KEY_ID>.p8.
          # It prints its rejections and still exits zero, which once let a whole
          # release report success while App Store Connect had refused the build.
          # Read the verdict rather than the exit code.
          set +e
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER" \
            --output-format json >altool.json 2>altool.log
          status=$?
          set -e
          cat altool.log
          cat altool.json
          if [ "$status" -ne 0 ] || grep -q '"product-errors"' altool.json \
            || grep -qE '^[0-9-]+ [0-9:.]+ ERROR' altool.log; then
            echo "::error::App Store Connect refused the upload" >&2
            exit 1
          fi
