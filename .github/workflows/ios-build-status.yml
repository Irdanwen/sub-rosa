name: iOS build status (TestFlight)

# Asks App Store Connect what it actually thinks of the builds we uploaded.
# A delivery can succeed and still never reach a tester: a build held for
# export compliance, still processing, or expired looks identical from the
# release lane, which only ever sees the upload succeed.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recent builds to report"
        required: false
        default: "5"
      answer_compliance_for:
        description: "Build version to answer export compliance for, e.g. 1.65.64 (leave empty to only report)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ask App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          LIMIT: ${{ inputs.limit }}
          ANSWER_FOR: ${{ inputs.answer_compliance_for }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import base64, json, os, time, urllib.request

          key = base64.b64decode(os.environ["APPLE_API_KEY_P8"]).decode()
          import jwt
          token = jwt.encode(
              {"iss": os.environ["APPLE_API_ISSUER"], "iat": int(time.time()),
               "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256",
              headers={"kid": os.environ["APPLE_API_KEY_ID"], "typ": "JWT"})

          def call(path, method="GET", body=None):
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/" + path,
                  method=method,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + token,
                           **({} if body is None else {"Content-Type": "application/json"})})
              with urllib.request.urlopen(request) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          def get(path):
              return call(path)

          # Naming the build is what keeps this from sweeping: an answer is a
          # declaration, and it is given to one delivery at a time.
          answer_for = (os.environ.get("ANSWER_FOR") or "").strip()

          apps = get("apps")["data"]
          for app in apps:
              print(f"App: {app['attributes']['name']} ({app['attributes']['bundleId']})")
              limit = int(os.environ.get("LIMIT") or 5)
              # Unsorted, the API hands back an arbitrary page and the build you
              # just delivered may simply not be on it. The builds collection
              # takes the app as a filter and sorts on the upload date.
              builds = get(
                  f"builds?filter[app]={app['id']}&limit={limit}"
                  "&sort=-uploadedDate")["data"]
              if not builds:
                  print("  No builds.")
              for build in builds:
                  a = build["attributes"]
                  print(f"  build {a.get('version')}  uploaded {a.get('uploadedDate')}")
                  print(f"    processing: {a.get('processingState')}   expired: {a.get('expired')}")
                  if answer_for and a.get("version") == answer_for \
                          and a.get("usesNonExemptEncryption") is None:
                      call(f"builds/{build['id']}", "PATCH", {
                          "data": {"type": "builds", "id": build["id"],
                                   "attributes": {"usesNonExemptEncryption": False}}})
                      a = get(f"builds/{build['id']}")["data"]["attributes"]
                      print("    answered export compliance for this build")
                  answer = a.get("usesNonExemptEncryption")
                  print("    export compliance: "
                        + ("not answered, TestFlight will hold this build"
                           if answer is None
                           else f"answered usesNonExemptEncryption={answer}"))
              print()
          PY
