name: supply chain

# Known CVEs in the dependency tree, checked on a clock rather than when
# somebody remembers. `docs/github-security-readiness.md` records one manual
# `cargo audit` run; a run that happened once is not a property.
#
# Dependabot (`.github/dependabot.yml`) already opens update PRs weekly. That
# tells us a newer version exists. This tells us the version we ship is
# vulnerable, which is a different question and the one that matters on the day
# an advisory lands.

on:
  workflow_dispatch:
  schedule:
    # Mondays, after Dependabot's 12:00 America/New_York pass has opened its PRs.
    - cron: "0 18 * * 1"
  pull_request:
    paths:
      - ".github/workflows/supply-chain.yml"
      - "src-tauri/.cargo/audit.toml"
      - "src-tauri/deny.toml"
      - "june-api/.cargo/audit.toml"
      - "june-api/deny.toml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "june-api/Cargo.toml"
      - "june-api/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supply-chain.yml"
      - "src-tauri/.cargo/audit.toml"
      - "src-tauri/deny.toml"
      - "june-api/deny.toml"
      - "src-tauri/Cargo.lock"
      - "june-api/Cargo.lock"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      # Both lockfiles are reported even when the first one fails: a run that
      # stops at the desktop crate hides whatever the backend is carrying.
      fail-fast: false
      matrix:
        workspace: [src-tauri, june-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the advisory database and the binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/advisory-db
          key: cargo-audit-${{ runner.os }}-0.22

      - name: Install cargo-audit
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            # 0.22 or newer: 0.21 cannot parse the CVSS 4.0 advisories now in
            # the RustSec database and fails before it reads a single lockfile.
            cargo install cargo-audit --locked --version ^0.22
          fi

      # Run from inside the workspace so its own `.cargo/audit.toml` policy
      # applies. The default policy fails on a vulnerability and reports
      # unmaintained / unsound / yanked crates as warnings — a vulnerability is
      # an incident, an unmaintained crate is a planning problem, and treating
      # them alike trains everyone to ignore the job.
      - name: Audit ${{ matrix.workspace }}
        working-directory: ${{ matrix.workspace }}
        run: cargo audit

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          if ! command -v cargo-deny >/dev/null 2>&1; then
            # 0.20 or newer: the `[advisories] unmaintained` key takes
            # "workspace" rather than a severity from 0.19 on, and deny.toml
            # is written for that schema.
            cargo install cargo-deny --locked --version ^0.20
          fi

      # Licenses, duplicate versions, and where a crate came from. The app
      # bundles an agent runtime, so its dependency tree deserves the same
      # scrutiny as its own code.
      - name: Check src-tauri
        run: cargo deny --manifest-path src-tauri/Cargo.toml --all-features check

      - name: Check june-api
        run: cargo deny --manifest-path june-api/Cargo.toml --all-features check

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0

      # No `cache: pnpm`: this job never installs, so there is no store to
      # save and the post-run cache step failed the job for nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The frontend ships inside the app bundle, so a vulnerable runtime
      # dependency is shipped code, not a build-time detail.
      - name: Audit production dependencies
        # The registry's audit endpoint times out now and then. A timeout is
        # retried; a finding is not.
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --prod --audit-level moderate 2>&1 | tee audit.log; then
              exit 0
            fi
            if grep -qE "FetchError|ERR_SOCKET_TIMEOUT|ECONNRESET|ETIMEDOUT" audit.log; then
              echo "Registry unreachable on attempt $attempt; retrying."
              sleep 30
              continue
            fi
            exit 1
          done
          echo "::error::The npm registry stayed unreachable; the audit could not run."
          exit 1
