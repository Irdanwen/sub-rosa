<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sub Rosa</title>
    <script>
      // Pre-paint theme bootstrap. Keep in sync with src/lib/theme.ts; the
      // storage key is duplicated here so the attribute is set before the
      // module bundle runs, avoiding a light-mode flash on dark systems.
      (function () {
        try {
          var stored = localStorage.getItem("os-june:theme");
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
          // Pre-paint brand accent. Keep the id->hex map in sync with
          // src/lib/brand.ts so a non-default accent doesn't flash rose first.
          var brand = localStorage.getItem("os-june:brand");
          var brands = {
            rose: "#936862",
            clay: "#9d5728",
            amber: "#8b6e4d",
            gold: "#8f6b2e",
            sage: "#607d65",
            blue: "#597893",
            plum: "#886885",
          };
          document.documentElement.style.setProperty(
            "--brand",
            brands[brand] || brands.rose,
          );
        } catch (e) {}
      })();
    </script>
    <style>
      /* The curtain.
       *
       * Between the window opening and React's first paint there was nothing:
       * the webview's own ground, which is white, on an app that is usually
       * dark. It read as a flash of somebody else's application, and on a slow
       * cold start it read as a hang.
       *
       * It lives here rather than in the bundle because the bundle is the thing
       * being waited for. It uses only what the script above has already
       * resolved -- the theme attribute and --brand -- so it is correct on the
       * very first frame, and it carries no glyph: the rose path lives in the
       * app, and a sixth copy of it that must be kept in sync is a worse trade
       * than a ground that is simply the right colour. The mark and the named
       * wait belong to the loading state the app itself shows, which is what
       * covers the long wait (the sidecar), not this one. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            120% 80% at 50% 42%,
            color-mix(in oklch, var(--brand) 14%, transparent),
            transparent 70%
          ),
          #f2efec;
        transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      [data-theme="dark"] #boot {
        background:
          radial-gradient(
            120% 80% at 50% 42%,
            color-mix(in oklch, var(--brand) 20%, transparent),
            transparent 70%
          ),
          #1a1614;
      }

      /* A single breath, so a curtain that stays up for more than an instant
       * is visibly alive without pretending to measure anything. */
      #boot::after {
        content: "";
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: color-mix(in oklch, var(--brand) 34%, transparent);
        animation: boot-breathe 1600ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #boot[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(0.86);
          opacity: 0.55;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot::after {
          animation: none;
        }
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
