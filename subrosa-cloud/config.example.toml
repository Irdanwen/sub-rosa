# Copy into a secret-managed config.toml, mounted read-only with mode 0600.
# These .invalid hosts intentionally cannot be used as a deployed environment.
bind = "0.0.0.0:8088"
public_url = "https://account.example.invalid"
# The direct Android release signing certificate. Add the Play App Signing
# certificate too when distributing via Play, and publish both in assetlinks.json.
passkey_android_cert_fingerprints = ["13:B7:E7:F8:0D:99:67:A0:02:53:C9:23:0F:89:54:B4:39:12:B2:BE:81:7D:9B:B9:F5:F7:B5:18:AD:D6:DC:49"]
development = false
# Supply the authenticated URL through SUBROSA_CLOUD_DATABASE_URL from the secret manager.
database_url = "postgres://subrosa@database.example.invalid/subrosa?sslmode=verify-full"
account_quota_bytes = 5368709120

[oidc]
issuer = "https://identity.example.invalid"
client_id = "REPLACE_WITH_REGISTERED_CLIENT"
client_secret = "REPLACE_WITH_SECRET_MANAGER_VALUE"

[storage]
kind = "s3"
bucket = "REPLACE_WITH_PRIVATE_BUCKET"
region = "eu-west-3"
# Prefer workload identity / instance roles. For a compatible provider, explicitly
# set endpoint, access_key and secret_key through the secret manager instead.
# endpoint = "https://objects.example.invalid"

# Keep this bucket and signing-key ring OUTSIDE database/ciphertext restore sets.
# Grant create/read/list, not delete; enforce Object Lock and independent retention.
[deletion_ledger]
active_key_id = "v1"
[deletion_ledger.signing_keys]
v1 = "REPLACE_WITH_BASE64URL_OF_32_RANDOM_BYTES_GENERATED_LOCALLY"
[deletion_ledger.storage]
kind = "s3"
bucket = "REPLACE_WITH_SEPARATE_DELETION_LEDGER_BUCKET"
region = "eu-west-3"

# Optional (ADR-0069): lets a device obtain its own Carpe Diem key. Leave the
# section out to keep the assertion route at 404. The key is a PKCS#8 P-256 PEM
# that deploy/vps/bootstrap.py generates; Carpe Diem pins its public half.
# [carpe_diem]
# audience = "https://carpe-diem.example.invalid/api/operator"
# kid = "sr-REPLACE_WITH_RENDERED_KID"
# signing_key = "REPLACE_WITH_SECRET_MANAGER_VALUE"
# What a browser device's Carpe Diem key may do (ADR 0096): credits per 24 h
# (hundredths of a dollar) and days before the browser asks again.
# browser_daily_cap_credits = 200
# browser_key_days = 7

# Optional (ADR 0097): public pages, profiles and the assistant catalog. Leave
# the section out to keep every publishing route at 404. The URL is an origin
# apart from public_url (see deploy/nginx-pages.conf.example); blocked_terms
# are refused in public content (docs/public-content-rules.md).
# [publication]
# url = "https://pages.example.invalid"
# blocked_terms = []
