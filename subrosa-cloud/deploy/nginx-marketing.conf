# English marketing site. The account website uses its own origin so unrelated
# applications on this domain cannot share access to the account browser vault.
server {
    listen 80;
    listen [::]:80;
    server_name furetier.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 308 https://furetier.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name furetier.com;
    ssl_certificate /etc/letsencrypt/live/furetier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furetier.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/subrosa/www;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /subrosa { return 308 /subrosa/; }
    location ^~ /subrosa/assets/ { try_files $uri =404; }
    location ^~ /subrosa/fonts/ { try_files $uri =404; }
    location = /subrosa/account { try_files $uri /subrosa/index.html; }
    location ^~ /subrosa/account/ { try_files $uri /subrosa/index.html; }
    location /subrosa/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
