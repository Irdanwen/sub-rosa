# First install for the existing furetier.com DNS record. Obtain the certificate
# with certbot certonly --webroot -w /var/www/certbot -d furetier.com, then replace
# this file with nginx-marketing.conf. Never replace another application's vhost.
server {
    listen 80;
    listen [::]:80;
    server_name furetier.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 404; }
}
