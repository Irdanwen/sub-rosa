# First install for the account origin, once the DNS record A subrosa exists.
# Obtain the certificate with
#   certbot certonly --webroot -w /var/www/certbot -d subrosa.furetier.com
# then replace this file with nginx-account.conf. Never replace another vhost.
server {
    listen 80;
    listen [::]:80;
    server_name subrosa.furetier.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 404; }
}
