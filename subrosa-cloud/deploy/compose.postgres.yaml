# Development dependency only. Production uses a private, backed-up TLS database.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:
